[package]
authors = ["banchen"]
edition = "2021"
name = "test"
resolver = "2"
rust-version = "1.77"
version = "0.1.0"

[[bin]]
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors
name = "test" 

[profile.release]
opt-level = "s"

[profile.dev]
debug = true # Symbols are nice, and they don't increase the size on Flash
opt-level = "z" 

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
anyhow = "1.0"
chrono = "0.4.43"
embedded-hal = "1.0.0"
embedded-hal-02 = { package = "embedded-hal", version = "0.2" }
esp-idf-hal = "0.45"
esp-idf-svc = "0.51"
libc = "0.2.182"
log = "0.4"
serde = "1.0.228"
serde_json = "1.0.149"
shtcx = "1.0.0"
toml-cfg = "0.2.0"
ssd1306 = "0.8"
embedded-graphics = "0.8"

[build-dependencies]
embuild = "0.33"
